<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ciencias 2do Grado</title>
  </head>
  <body>
    <div class="container">

      <header>
        <h1>⚡ Ciencias · 2do Grado</h1>
        <p class="header-sub">Selecciona una sección para comenzar</p>
      </header>

      <main>
        <div class="lessons-grid">

          <div class="lesson-card locked">
            <span class="lesson-number">Sección 1</span>
            <p>Energía Mecánica</p>
            <span class="lock-icon">🔒</span>
          </div>

          <div class="lesson-card locked">
            <span class="lesson-number">Sección 2</span>
            <p>Energía Eléctrica</p>
            <span class="lock-icon">🔒</span>
          </div>

          <div class="lesson-card locked">
            <span class="lesson-number">Sección 3</span>
            <p>Energía Térmica</p>
            <span class="lock-icon">🔒</span>
          </div>

          <div class="lesson-card locked">
            <span class="lesson-number">Sección 4</span>
            <p>Estados de la Materia</p>
            <span class="lock-icon">🔒</span>
          </div>

          <div class="lesson-card locked">
            <span class="lesson-number">Sección 5</span>
            <p>Transformaciones</p>
            <span class="lock-icon">🔒</span>
          </div>

          <div class="lesson-card active" id="lesson-6-btn">
            <span class="lesson-number">Sección 6</span>
            <p>La Luz</p>
            <span class="action-badge">¡Explorar!</span>
          </div>

        </div>
      </main>

    </div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
